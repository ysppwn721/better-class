# ============================================================================
# .github/workflows/android.yml
#   · 每次 push / PR：构建 APK 并上传为 Artifact（可直接下载安装）
#   · 打 v* 标签：创建 GitHub Release，把 APK 挂成长期可下载的附件
#
# 设计说明（踩过的坑，别再犯）：
#   1) YAML 只认 # 注释。曾误用 /* */ 块注释，导致 GitHub 解析失败、
#      运行记录里一个作业都没有 —— 排查成本很高。
#   2) 不依赖 android-actions/setup-android 之类第三方动作（实测会挂），
#      改为自己下 cmdline-tools + sdkmanager 装平台组件，稳定可控。
#   3) 构建优先走 Gradle 工程；若 Gradle 链路出问题，自动回退到仓库自带的
#      tools/build_apk.mjs（aapt2+javac+d8+apksigner 直构建，本地已验证）。
# ============================================================================
name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（cmdline-tools + platform 35 + build-tools 35.0.1）
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"

      - name: 解析器单测
        run: node tests/parser.test.mjs

      - name: 工作流自检
        run: node tools/check_workflows.mjs

      - name: 打包单文件网页
        env:
          # 配了 Secret 就把它内嵌进 APK，让用户零配置用上截图识别
          BC_AI_ENDPOINT: ${{ secrets.BC_AI_ENDPOINT }}
        run: node build.mjs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.9'

      - name: 构建 APK（Gradle）
        id: gradle_build
        continue-on-error: true
        working-directory: android
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 构建 APK（直构建兜底）
        if: steps.gradle_build.outcome != 'success'
        run: node tools/build_apk.mjs

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk out/kebiao-debug.apk
            echo "来源：Gradle"
          elif [ -f out/kebiao-debug.apk ]; then
            echo "来源：直构建兜底"
          else
            echo "✗ 两种构建方式都没有产出 APK"; exit 1
          fi
          ls -lh out/

      - name: 校验 APK 签名
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name 'apksigner*' | head -1)
          "$APKSIGNER" verify --print-certs out/kebiao-debug.apk

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kebiao-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 打标签时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## 安装

            下载下面的 `kebiao-debug.apk`，在手机上点击安装（首次需允许「未知来源」）。

            ## 说明

            - 完全离线可用：不点「截图识别」就不会联网
            - 导入课表两条路：**粘贴文本**（零成本、最准）/ **截图识别**（需视觉模型）
            - 首次打开可点「载入示例」先看效果
            - 支持夏季 / 冬季两套作息，按周过滤，导出图片与日历
