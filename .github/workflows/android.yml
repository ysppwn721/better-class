# ============================================================================
# .github/workflows/android.yml
#   · 每次 push / PR：构建 APK 并上传为 Artifact（可下载安装）
#   · 打 v* 标签：构建 release APK 并自动创建 GitHub Release（附件可长期下载）
#
# 注意：YAML 只认 # 注释。这里曾经误用了 /* */ 块注释，
#       导致 GitHub 解析失败、运行记录里一个作业都没有 —— 别再犯。
# ============================================================================
name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 仓库里没有提交 gradle-wrapper.jar（二进制不入库），
      # 所以这里显式装一个 Gradle；如果将来补了 wrapper，脚本会自动优先用 wrapper。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 解析器单测
        run: node tests/parser.test.mjs

      - name: 打包单文件网页（可注入内嵌 AI 通道）
        env:
          # 把仓库 Secret 配成你的代理地址，APK 就自带零配置识别能力
          BC_AI_ENDPOINT: ${{ secrets.BC_AI_ENDPOINT }}
        run: node build.mjs

      - name: 构建 APK
        working-directory: android
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 重命名产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kebiao-debug.apk
          ls -lh out

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kebiao-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 打标签时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## 安装
            下载下面的 `kebiao-debug.apk`，在手机上点击安装（需允许「未知来源」）。

            ## 说明
            - 完全离线可用；导入课表支持「截图识别」与「粘贴文本」两条路
            - 首次打开可点「载入示例」先看效果
